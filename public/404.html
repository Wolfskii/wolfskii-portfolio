<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#FEDE65" />
		<title>404 — Wolfskii</title>
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<style>
			:root {
				--ink: #111;
				--yellow: #fede65;
				--coral: #ff7051;
				--paper: #fff8e8;
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				padding: 1.5rem;
				background: var(--yellow);
				color: var(--ink);
				font-family: 'Space Grotesk', 'Archivo Black', system-ui, sans-serif;
				border: 10px solid var(--ink);
			}
			main {
				max-width: 36rem;
				background: var(--paper);
				border: 3px solid var(--ink);
				box-shadow: 8px 8px 0 var(--ink);
				padding: 1.6rem 1.4rem 1.8rem;
			}
			.kicker {
				display: inline-block;
				background: var(--ink);
				color: #fff;
				font-size: 0.75rem;
				font-weight: 800;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				padding: 0.28rem 0.5rem;
				margin-bottom: 0.8rem;
			}
			h1 {
				font-family: 'Archivo Black', system-ui, sans-serif;
				font-size: clamp(2.4rem, 8vw, 4rem);
				letter-spacing: -0.04em;
				line-height: 0.9;
				margin: 0 0 0.8rem;
				filter: drop-shadow(4px 4px 0 var(--coral));
			}
			p {
				font-weight: 600;
				line-height: 1.5;
				margin: 0 0 1.3rem;
			}
			a {
				display: inline-flex;
				background: var(--coral);
				color: var(--ink);
				font-weight: 800;
				text-decoration: none;
				border: 3px solid var(--ink);
				box-shadow: 4px 4px 0 var(--ink);
				padding: 0.7rem 1.1rem;
			}
			a:hover {
				transform: translate(2px, 2px);
				box-shadow: 2px 2px 0 var(--ink);
			}
		</style>
	</head>
	<body>
		<main>
			<span class="kicker">404</span>
			<h1>Wrong cave.</h1>
			<p>
				This URL is not load-bearing. The portfolio is. Thick borders live at the root, not in the
				fog.
			</p>
			<a href="/">Back to wolfskii.dev</a>
		</main>
	</body>
</html>
